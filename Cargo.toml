# The workspace of this repository's Rust components. Every dependency's
# version is pinned here, under [workspace.dependencies], and nowhere else: a
# member names it as `foo.workspace = true`. A member that uses a sibling
# component names its folder: `foo = { path = "../foo" }`.
[workspace]
members = ["model", "extract", "mentalc"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# The model's records and diagnostics derive their JSON form (model); the
# build readers derive how `pyproject.toml` and `uv.lock` read (extract).
serde ={ version = "1.0.229", features = ["derive"] }
# Reads and writes the model's JSONL files (model).
serde_json = "1.0.154"
# Property tests of the parsers, the build readers and the JSONL round trip;
# without its default features, which fork a process per case (model and
# extract, dev).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Snapshots of written output, such as the frozen JSONL format; without its
# default terminal colors (model, dev).
insta = { version = "1.49.0", default-features = false }
# Reads `pyproject.toml` and `uv.lock`, with the byte spans that anchor each
# record; without its default writer, which nothing here uses (extract).
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

# ruff's parser and syntax tree, which list a Python file's reference
# sites, from the ruff commit ty 0.0.105 is built from; every ruff and ty
# crate names this one commit and is bumped with the others (extract, X1).
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", rev = "4228f4c2168d50dc60df1aec705a1438c75a4888" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", rev = "4228f4c2168d50dc60df1aec705a1438c75a4888" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", rev = "4228f4c2168d50dc60df1aec705a1438c75a4888" }

[workspace.lints.rust]
unsafe_code = "forbid"

# `cargo clippy -- -D warnings` fails on each of these; builds and tests only
# warn, so work in progress still compiles.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Errors say what went wrong: no `unwrap()` outside tests (clippy.toml), and
# an `expect()` names the invariant that makes it safe.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
# A suppression is `#[expect(lint, reason = "…")]`, which fails once it's stale.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Every dependency, ty's crates and proptest included, is built optimized in
# the dev and test profiles, so a resolver test stays within its 1 s budget;
# the workspace's own crates stay unoptimized, with their assertions (T19).
[profile.dev.package."*"]
opt-level = 3
