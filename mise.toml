# Generated by alpha: the repository checks' tools and tasks.
# `mise run ci` runs what CI runs on a pull request, `mise run check` adds
# each component's checks, `mise run scheduled` runs the weekly scans, and
# `mise run check:toolchain` looks for newer releases of the pinned tools.
# `mise run --continue-on-error <task>` reports every failing check, not
# only the first.
# Tasks don't install missing tools of your global mise config.

[settings]

[settings.task]
run_auto_install = false

[tools]
jactionlint = "2.5.0"
"github:betterleaks/betterleaks" = "1.10.0"
osv-scanner = "2.7.0"
typos = "1.52.0"
rumdl = "0.3.2"
lychee = "0.24.2"
"github:agent-sh/agnix" = "0.61.0"

[tasks]

[tasks."check:actions"]
run = "jactionlint"

[tasks."check:secrets"]
run = "python3 .claude/alpha/checks/secret_scan.py betterleaks dir --no-banner --no-color --config .betterleaks.toml"

[tasks."check:vulns"]
run = "osv-scanner scan source --no-ignore ."

[tasks."check:typos"]
run = "typos"

[tasks."check:markdown"]
run = "python3 .claude/alpha/checks/ratchet.py markdown"

[tasks."check:links"]
run = "python3 .claude/alpha/checks/ratchet.py links"

[tasks."check:links-online"]
run = "lychee --no-progress ."

[tasks."check:agent-config"]
run = "agnix --strict"

[tasks."check:review-dates"]
run = "python3 .claude/alpha/checks/review_dates.py"

[tasks."check:toolchain"]
run = "mise outdated --no-global --bump --json | python3 -c \"import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2)); d and print('Pinned tools have newer releases: run mise upgrade --bump --no-global and commit mise.toml (then rerun the checks)'); sys.exit(1 if d else 0)\""

[tasks."check:baselines"]
run = "python3 .claude/alpha/checks/diff_checks.py baselines"

[tasks."check:component:model"]
dir = "model"
run = ["cargo fetch", "cargo fmt --check", "cargo clippy --all-targets --no-deps -- -D warnings", "cargo check --all-targets", "cargo machete", "cargo test"]

[tasks."check:component:extract"]
dir = "extract"
run = ["cargo fetch", "cargo fmt --check", "cargo clippy --all-targets --no-deps -- -D warnings", "cargo check --all-targets", "cargo machete", "cargo test"]

[tasks."check:component:mentalc"]
dir = "mentalc"
run = ["cargo fetch", "cargo fmt --check", "cargo clippy --all-targets --no-deps -- -D warnings", "cargo check --all-targets", "cargo machete", "cargo test"]

[tasks.ci]
description = "Run the repository checks CI runs on a pull request"
depends = ["check:actions", "check:secrets", "check:vulns", "check:typos", "check:markdown", "check:links", "check:agent-config", "check:review-dates", "check:baselines"]

[tasks.scheduled]
description = "Run the repository checks CI runs on a schedule"
depends = ["check:vulns", "check:links-online", "check:review-dates"]

[tasks.check]
description = "Run the pull-request checks and every component's checks"
depends = ["ci", "check:component:model", "check:component:extract", "check:component:mentalc"]
