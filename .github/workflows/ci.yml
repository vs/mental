# Generated by alpha: each component's checks, as in CLAUDE.md.
name: "CI"
"on":
  push:
    branches:
      - "main"
  pull_request: {}
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: "read"
jobs:
  model:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "model"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: "actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30" # v2.0.1
        with:
          toolchain: "nightly-2026-11-10"
          components: "llvm-tools-preview"
          override: "false"
          cache: "false"
      - uses: "actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30" # v2.0.1
        with:
          rust-src-dir: "."
          cache-workspaces: "."
      - uses: "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39" # v2.90.3
        with:
          tool: "cargo-llvm-cov@0.9.1,cargo-machete@0.9.2"
      - name: "setup"
        run: "cargo fetch"
      - name: "format_check"
        run: "cargo fmt --check"
      - name: "lint"
        run: "cargo clippy --all-targets --no-deps -- -D warnings"
      - name: "typecheck"
        run: "cargo check --all-targets"
      - name: "structure"
        run: "cargo machete"
      - name: "test"
        run: "cargo test"
        if: "github.event_name != 'pull_request'"
      - name: "test with coverage"
        if: "github.event_name == 'pull_request'"
        run: "cargo +nightly-2026-11-10 llvm-cov --branch --cobertura --output-path coverage.xml"
      - name: "diff coverage"
        if: "github.event_name == 'pull_request'"
        env:
          BASE_REF: "${{ github.base_ref }}"
        run: 'pipx run diff-cover==11.0.1 coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=100 --branch-coverage'
      - name: "Checks left the tree unchanged"
        run: 'git diff --exit-code && test -z "$(git status --porcelain)"'
