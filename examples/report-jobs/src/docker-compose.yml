services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: &env
      DATABASE_URL: postgresql://reports:reports@postgres/reports
      CELERY_BROKER_URL: redis://redis:6379/0
      REPORTS_BUCKET: acme-reports
    depends_on: [postgres, redis]

  worker:
    build: .
    command: celery -A app.tasks worker --concurrency 1
    environment: *env
    deploy:
      replicas: 2
    depends_on: [postgres, redis]

  beat:
    build: .
    command: celery -A app.tasks beat
    environment: *env
    depends_on: [redis]

  redis:
    image: redis:7.4

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: reports
      POSTGRES_DB: reports
