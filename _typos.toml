# FRAM, FASE, STAF, ZooKeeper FLE, Event-B THM, false-positive rate FPR,
# Ba et al., Sci. Comput. Program., ninja's restat, Redis SMOVE, Rust's flate2.
Certi = "Certi"
Veru = "Veru"
Cros = "Cros"
Fo = "Fo"
Tect = "Tect"
Tru = "Tru"
Heros = "Heros"
Jaques = "Jaques"
Mattern = "Mattern"
Synopsys = "Synopsys"
systemc = "systemc"
FRAM = "FRAM"
FASE = "FASE"
STAF = "STAF"
FLE = "FLE"
THM = "THM"
FPR = "FPR"
Ba = "Ba"
