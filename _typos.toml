# Generated by alpha: typos settings. For a word the project spells that way
# on purpose, add it under [default.extend-words], e.g. `ser = "ser"`.

[files]
extend-exclude = [".claude/alpha/state/", ".claude/alpha/notes/", ".claude/settings.local.json", ".claude/worktrees/", ".DS_Store", ".claude/alpha/hooks/__pycache__/", ".claude/alpha/checks/__pycache__/", ".env", ".env.*", "**/.env", "**/.env.*", "/target/", "model/**/coverage.xml", "extract/**/coverage.xml", "mentalc/**/coverage.xml", "Cargo.lock", "CHANGELOG.md", "docs/research/*/experiments/results/"]

[default]
# Commit hashes in research notes and tables, such as `04ba6b7`.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# Fixel Display and Fixel Text, the typefaces of docs/alpha/design-language.md
Fixel = "Fixel"
# Names and abbreviations cited in the research: CertiKOS, VeruSAGE, CrosSym,
