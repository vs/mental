[[components]]
name = "model"
path = "model"
kind = "library"
stack = "rust"
manifests = ["model/Cargo.toml", "Cargo.toml"]
lockfiles = ["Cargo.lock"]
source_globs = ["model/**/*.rs"]
test_globs = ["model/tests/**/*.rs", "model/**/tests.rs"]
exclude_globs = ["model/**/.*/**", "model/**/target/**"]
workspace = ["Cargo.toml", "clippy.toml", "rust-toolchain.toml"]

[components.commands]
setup = "cargo fetch"
format_check = "cargo fmt --check"
lint = "cargo clippy --all-targets --no-deps -- -D warnings"
typecheck = "cargo check --all-targets"
structure = "cargo machete"
test = "cargo test"
format = "cargo fmt"
format_file = "rustfmt --edition 2024 {file}"
lint_file = ""

[[components.rules]]
id = "rust:cargo-for-dependencies"
rule = "Declare each dependency once, in `[workspace.dependencies]` of the root Cargo.toml, and name it in a member with `foo.workspace = true`; add and remove them with cargo commands where cargo supports it, never by copying versions into a member."

[[components.rules]]
id = "rust:typed-boundaries"
rule = "Parse external input (arguments, environment, files, JSON) into typed structs at the boundary (clap and serde derives); don't pass `serde_json::Value` or raw strings inward."

[[components.rules]]
id = "rust:errors-with-context"
rule = "A library returns its own error enum; a binary adds context to each error it passes up, saying what failed and how to fix it. `expect()` only for an invariant, with a message naming it."

[[components.rules]]
id = "rust:tests-beside-code"
rule = "Put a module's unit tests in a `tests.rs` file beside it (`#[cfg(test)] mod tests;`), not inline, and behavior through the public API in `tests/`."

