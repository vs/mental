# Single source of truth for this project's principles, review risk paths,
# protected paths and component commands. Edit by hand or through alpha skills;
# hooks and reviewers read this file.

schema = 1
kit_version = "2.0.1"
dependency_log = "docs/alpha/dependencies.md"

[project]
name = "Mental"
slug = "mental"

[review]
risk_paths = ["**/migrations/**", "**/*.proto", "**/openapi*.yaml", "**/openapi*.yml", "**/openapi*.json", "**/auth/**", "**/security/**", ".github/**", "docs/alpha/principles.toml", "model/src/id.rs", "model/src/record.rs", "model/src/record/**", "model/src/guard.rs", "docs/specification.md", "examples/*/model/**", "model/src/anchor.rs", "model/src/diagnostic.rs", "model/src/jsonl.rs", "docs/alpha/design-language.md"]

[protected]
