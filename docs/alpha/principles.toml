[[principles]]
id = "dependency-reasons"
title = "Every new dependency has a recorded reason"
statement = "Every new dependency has a recorded reason and is pinned."
rationale = "Each dependency is a long-term liability; recording why it exists lets it be questioned and removed later."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:stop_checks"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "clean-history"
title = "Clean, readable history"
statement = "Each commit is one logical change, holds only the files changed for it, passes checks on its own, and has a message that explains why."
rationale = "Readable history makes review, bisecting, and reverting practical."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:commit_msg"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "evidence-before-done"
title = "Evidence before \"done\""
statement = "No claim of success without running the check that shows it."
rationale = "Unverified claims of success are the most common source of broken handoffs."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "never-weaken-checks"
title = "Never weaken a check to pass it"
statement = "No skipped tests, loosened lint, or catch-all exception handlers, and no mocking the thing under test. A type error from an outdated dependency is fixed by upgrading it, not by removing or downgrading code. If a check is wrong in one place, add a row to CONTRIBUTING.md's Exceptions table that names the path, the rule and why, then make the exception there."
rationale = "A check bent to pass proves nothing; an exception with a recorded reason can be reviewed, and reverted when the reason stops holding."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:guard_paths"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "stay-in-scope"
title = "Stay in scope"
statement = "No drive-by refactors of code the task doesn't touch."
rationale = "Unrelated changes bloat review and hide the real change in the diff."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "subtract-first"
title = "Subtract before you add"
statement = "In the code a task touches, first remove what's dead there: unused code, redundant checks, stubs. A new internal API replaces the old one in the same change: every caller migrated, the old one deleted, no compatibility layer."
rationale = "Building on a simpler base keeps the change small, and a compatibility layer kept for now becomes a second API to maintain."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "smallest-change"
title = "Smallest complete change"
statement = "Take the first option that fully works: skip what nobody asked for, then reuse what the codebase has, then the standard library or platform, then an installed dependency, then one line a reader gets at a glance, and only then new code. No new dependency for a few lines, and no abstraction, wrapper, option, config or \"for later\" code nobody asked for; keep values in the form the platform already gives you, and keep the structure the codebase already has. Never cut validation at trust boundaries, error handling that prevents data loss, security, accessibility, or anything the user asked for."
rationale = "Every line written must be read, tested and fixed later, so the smallest change that fully works is the cheapest to own."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "scope-first"
title = "Scope before writing"
statement = "Before changing code, list every place the change must reach (callers, tests, fixtures, config, exports) and what it could break for users (data lost or exposed, callers that stop working), then finish every part of it. Features nobody asked for aren't scope."
rationale = "A change that misses a caller or a fixture breaks later, far from the edit."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "fix-at-the-root"
title = "Fix bugs at the root"
statement = "Before a bug fix, find every caller of the function it touches and fix the root cause once, in the shared code, not in one caller. Code that is moved or merged keeps its error handling and validation."
rationale = "A fix in one caller leaves the others broken, and a move that drops validation is a new bug."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "lean-structure"
title = "Lean structure"
statement = "Near-copies that must change together are merged into one. A function is split by job, never by line count, and never into helpers that only make it shorter. Between options of equal size, the one that is correct on edge cases wins."
rationale = "Copies drift apart when only one changes, and a split by size adds layers between a question and its answer."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "never-block-on-the-human"
title = "Never block on the human"
statement = "Don't stop to ask about reversible work. When a requirement is ambiguous, make the reasonable choice, write it into the docs, and say what you chose. Ask first only when the choice sets product direction or can't be undone: rewriting the main branch, deploys, deleting data, messages to people."
rationale = "The user supervises asynchronously: a recorded, reversible choice costs less than a stalled session, and the record makes it quick to correct."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "definition-of-done"
title = "Definition of done"
statement = "Tests written and passing, types and lint clean, docs updated, committed per the history principle, reviewed before it reaches main."
rationale = "One shared checklist for done keeps completion from being a matter of opinion."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:stop_checks"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

# Project principles from docs/guidelines/README.md ("Project principles");
# each carries the guideline rules named in its statement.

[[principles]]
id = "fixed-crate-graph"
title = "Four crates, one direction"
statement = "The workspace has exactly the edges model <- extract <- mentalc and model <- mentalvm; model depends on no workspace crate, mentalc and mentalvm share only files in the model format, and an item is pub only when another crate uses it (G1, G2)."
rationale = "Each tool can then be built, tested and replaced alone, and the interpreter never depends on the compiler."
applies = ["always"]
core = false
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "deterministic-output"
title = "Same inputs, same bytes"
statement = "The same inputs give byte-identical output: ordered collections only, stable blake3 hashes over canonical bytes, seeds and clocks passed in as parameters, canonical sorted JSONL (G6, G7, G8, M7, X16, V6, T18)."
rationale = "A model that changes between identical builds cannot be diffed, cached or trusted."
applies = ["always"]
core = false
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "fail-rather-than-degrade"
title = "A partial result is an error"
statement = "A missing input or key, an unknown field or format version, a cache miss offline and exhausted repairs end the command with an error naming the fix; no code path writes a partial model or falls back silently (G11, M9, M10, C11, C13)."
rationale = "A degraded model is later read as complete (spec P9)."
applies = ["always"]
core = false
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "no-bloat"
title = "Every line and crate earns its place"
statement = "No framework where a function does, every dependency justified once and within its crate's allowlist, none of the banned weight, size limits kept, nothing out of version one's scope (G3, G15, G16, G17, M20, X17, V18)."
rationale = "Compile time, fewer things to break, and a codebase one person can own."
applies = ["always"]
core = false
checked_by = ["reviewer"]
active = true
components = ["model", "extract", "mentalc"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "one-canonical-form"
title = "One text form per identity"
statement = "IDs enter only through the parser, every accepted ID and guard re-displays to the same bytes, one slug alphabet with no escaping, and the JSONL text is canonical (M1, M2, M3, M7)."
rationale = "Two spellings of one identity break references, caches and diffs."
applies = ["always"]
core = false
checked_by = ["reviewer"]
active = true
components = ["model"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "extractors-never-guess"
title = "Unknown is recorded, never guessed or dropped"
statement = "Every lookup returns resolved, external or unresolved with a closed reason; every call, decorator and branch appears in the output exactly once; no heuristic edge or inference of our own on top of the type checker (X7, X8, X9)."
rationale = "Extractors own completeness (spec P6); a guess presented as fact is worse than a recorded gap."
applies = ["always"]
core = false
checked_by = ["reviewer"]
active = true
components = ["extract"]
override = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "one-judge-for-every-backend"
title = "Every LLM answer passes the same checks"
statement = "Checking, repair, caching and ledger writes happen in accept, whatever backend answered; checks re-run on every cache hit; repairs are capped and the build fails closed (C4, C9, C11)."
rationale = "The model is only as trustworthy as its weakest backend path, so there must be only one path."
applies = ["always"]
core = false
checked_by = ["reviewer"]
active = true
components = ["mentalc"]
override = ""

[principles.params]

[principles.component_params]

# Inactive until the mentalvm component exists (milestone 6).
[[principles]]
id = "semantics-stay-in-the-step"
title = "Reductions live in strategies, never in the step"
statement = "The step function prunes nothing, and every choice it offers is named with its values; search reductions belong to strategies (V3, V5)."
rationale = "A step that prunes changes what the model means, and a replay against a changed model must say where it diverged."
applies = ["always"]
core = false
checked_by = ["reviewer"]
active = false
components = []
override = ""

